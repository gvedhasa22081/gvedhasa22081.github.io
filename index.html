<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Listen by GVS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ---------- GLOBAL ---------- */
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0ff2, #020817 70%);
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      margin: 20px 0 5px;
      color: #00eaff;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    /* ---------- LAYOUT ---------- */
    .container {
      display: flex;
      gap: 20px;
      padding: 0 20px 120px;
      max-width: 1200px;
      margin: auto;
    }

    .panel {
      flex: 1;
      background: rgba(15, 25, 45, 0.6);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 0 25px rgba(0,234,255,0.12);
      backdrop-filter: blur(12px);
    }

    .panel h2 {
      margin-top: 0;
      color: #9ff;
    }

    /* ---------- SONG LIST ---------- */
    .song {
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      margin-bottom: 10px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .song:hover {
      background: rgba(0,234,255,0.15);
    }

    .song span {
      font-size: 14px;
      opacity: 0.8;
    }

    /* ---------- PLAYER BAR ---------- */
    .player {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 900px;
      background: rgba(10,15,30,0.9);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 0 35px rgba(0,234,255,0.35);
    }

    .player-title {
      font-weight: bold;
      color: #00eaff;
      margin-bottom: 8px;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .controls button {
      background: #00eaff;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 16px;
      cursor: pointer;
    }

    .controls button:hover {
      box-shadow: 0 0 15px #00eaff;
    }

    input[type="range"] {
      flex: 1;
    }

    /* ---------- SLEEP TIMER ---------- */
    .sleep {
      margin-top: 15px;
    }

    .sleep button {
      margin-right: 8px;
      margin-top: 5px;
      padding: 8px 14px;
      border-radius: 10px;
      border: none;
      background: #111;
      color: #00eaff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0,234,255,0.25);
    }

    /* ---------- MODAL ---------- */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal-box {
      background: #0b1220;
      padding: 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 0 30px #00eaff;
    }

    .modal-box button {
      margin: 10px;
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }

    .enable {
      background: #00eaff;
    }

    .skip {
      background: #333;
      color: #fff;
    }
  </style>
</head>
<body>

  <h1>LISTEN BY GVS</h1>
  <div class="subtitle">Neon Music Player · Queue · Sleep Timer · Notifications</div>

  <div class="container">
    <div class="panel">
      <h2>All Songs</h2>

      <div class="song" onclick="playSong(0)">
        <div>Powerhouse<br><span>Coolie Superstar</span></div>
      </div>

      <div class="song" onclick="playSong(1)">
        <div>Satranga<br><span>ANIMAL</span></div>
      </div>

      <div class="song" onclick="playSong(2)">
        <div>Aavan Jaavan<br><span>WAR 2</span></div>
      </div>

    </div>

    <div class="panel">
      <h2>Sleep Timer</h2>
      <div class="sleep">
        <button onclick="setSleepTimer(5)">5 min</button>
        <button onclick="setSleepTimer(10)">10 min</button>
        <button onclick="setSleepTimer(30)">30 min</button>
      </div>
    </div>
  </div>

  <!-- PLAYER -->
  <div class="player">
    <div class="player-title" id="nowPlaying">Not Playing</div>
    <div class="controls">
      <button onclick="togglePlay()">▶</button>
      <input type="range" id="seek" value="0">
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="audio"></audio>

  <!-- NOTIFICATION MODAL -->
  <div class="modal" id="notifModal">
    <div class="modal-box">
      <h3>🔔 Enable Notifications?</h3>
      <p>Get alerts when music stops or sleep timer ends.</p>
      <button class="enable" id="enableNotif">Enable</button>
      <button class="skip" id="skipNotif">Skip</button>
    </div>
  </div>

  <script>
    /* ---------- SONG DATA ---------- */
    const songs = [
      { title: "Powerhouse", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { title: "Satranga", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { title: "Aavan Jaavan", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];

    const audio = document.getElementById("audio");
    const nowPlaying = document.getElementById("nowPlaying");
    const seek = document.getElementById("seek");

    let currentSong = -1;
    let sleepTimer = null;

    /* ---------- PLAY ---------- */
    function playSong(index) {
      currentSong = index;
      audio.src = songs[index].src;
      audio.play();
      nowPlaying.textContent = "Now Playing: " + songs[index].title;
    }

    function togglePlay() {
      if (audio.paused) audio.play();
      else audio.pause();
    }

    /* ---------- SEEK ---------- */
    audio.addEventListener("timeupdate", () => {
      seek.max = audio.duration || 0;
      seek.value = audio.currentTime;
    });

    seek.oninput = () => audio.currentTime = seek.value;

    /* ---------- SLEEP TIMER ---------- */
    function setSleepTimer(min) {
      if (sleepTimer) clearTimeout(sleepTimer);

      sleepTimer = setTimeout(() => {
        audio.pause();

        if (Notification.permission === "granted") {
          new Notification("⏰ Sleep Timer", {
            body: "Music stopped automatically."
          });
        }

        alert("Sleep timer ended. Music stopped.");
      }, min * 60000);

      alert("Sleep timer set for " + min + " minutes");
    }

    /* ---------- NOTIFICATION PERMISSION ---------- */
    window.onload = () => {
      if ("Notification" in window && Notification.permission === "default") {
        document.getElementById("notifModal").style.display = "flex";
      }
    };

    document.getElementById("enableNotif").onclick = () => {
      Notification.requestPermission().then(p => {
        if (p === "granted") {
          new Notification("🎵 Listen by GVS", {
            body: "Notifications enabled!"
          });
        }
        document.getElementById("notifModal").style.display = "none";
      });
    };

    document.getElementById("skipNotif").onclick = () => {
      document.getElementById("notifModal").style.display = "none";
    };
  </script>

</body>
</html>
